<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator DEMO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header>
        <i class="fa-solid fa-language"></i> TRANSLATOR DEMO
    </header>

    <div class="container">
        <div class="column">
            <div class="column-header">
                <span id="label-source">Bạn đã nói: </span>
                <select id="source-lang" class="lang-select">
                    <option value="vi-VN" selected>Tiếng Việt</option>
                    <option value="en-US">English</option>
                    <option value="zh-CN">中文</option>
                    <option value="ja-JP">日本語</option>
                    <option value="fr-FR">Français</option>
                    <option value="es-ES">Español</option>
                </select>
            </div>
            <div id="original-box" class="chat-box"></div>
        </div>

        <div class="column">
            <div class="column-header">
                <span id="label-target">Văn bản đã dịch: </span>
                <select id="target-lang" class="lang-select">
                    <option value="en" selected>English</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
            <div id="translated-box" class="chat-box"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="chat-input-wrapper">
            <input type="text" id="chat-input" placeholder="Nhập văn bản hoặc bấm micro để nói..." autocomplete="off">
            <button id="send-btn" class="send-btn" title="Gửi văn bản">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <div class="mic-container">
            <button id="start-btn" class="mic-btn" title="Bấm để nói">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <div class="mic-hint">BẤM ĐỂ NÓI</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
